<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>支线漫画横滑 Demo</title>
    <style>
      :root {
        color-scheme: dark;
        --comic-ratio: 588 / 1280;
        --surface: #0b0b0d;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--surface);
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .stage {
        position: relative;
        width: min(100vw, calc(100dvh * 588 / 1280));
        height: min(100dvh, calc(100vw * 1280 / 588));
        max-width: 100vw;
        max-height: 100dvh;
        overflow: hidden;
        background: #111;
        box-shadow: 0 24px 80px rgb(0 0 0 / 55%);
        isolation: isolate;
      }

      .comic-track {
        display: flex;
        width: 100%;
        height: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        scroll-behavior: smooth;
        scroll-snap-type: x mandatory;
        overscroll-behavior-x: contain;
        scrollbar-width: none;
        touch-action: none;
        -webkit-overflow-scrolling: touch;
        cursor: grab;
      }

      .comic-track::-webkit-scrollbar {
        display: none;
      }

      .comic-track.is-dragging {
        cursor: grabbing;
        scroll-snap-type: none;
        scroll-behavior: auto;
      }

      .comic-page {
        position: relative;
        flex: 0 0 100%;
        width: 100%;
        height: 100%;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        overflow: hidden;
        background: #111;
      }

      .comic-page img {
        position: absolute;
        left: var(--media-x, 0px);
        top: var(--media-y, 0px);
        display: block;
        width: var(--media-width, 100%);
        height: var(--media-height, 100%);
        object-fit: fill;
        -webkit-user-drag: none;
        user-select: none;
        pointer-events: none;
      }

      .slide-progress {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }

      .progress-track {
        position: absolute;
        inset: 0;
      }

      .progress-thumb {
        border-radius: 999px;
      }

      .progress-thumb {
        position: absolute;
        top: var(--thumb-y, 0px);
        left: var(--thumb-x, 0px);
        width: var(--thumb-width, 0px);
        height: var(--thumb-height, 0px);
        background: rgb(255 255 255 / 96%);
        transform: translate3d(0, 0, 0);
      }

      .choice-overlay {
        position: absolute;
        inset: 0;
        z-index: 3;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.9);
        transform-origin: 50% 52%;
        transition:
          opacity 160ms ease-out,
          transform 260ms cubic-bezier(0.18, 0.9, 0.24, 1.16);
      }

      .stage.is-choice-open .choice-overlay {
        opacity: 1;
        pointer-events: auto;
        transform: scale(1);
      }

      .choice-overlay img {
        position: absolute;
        left: var(--media-x, 0px);
        top: var(--media-y, 0px);
        display: block;
        width: var(--media-width, 100%);
        height: var(--media-height, 100%);
        object-fit: fill;
        -webkit-user-drag: none;
        user-select: none;
      }

      .choice-action {
        position: absolute;
        border: 0;
        padding: 0;
        background: transparent;
        appearance: none;
        cursor: pointer;
      }

      .choice-action--original {
        left: 10%;
        top: 30%;
        width: 77%;
        height: 14%;
      }

      .comic-page[hidden] {
        display: none;
      }

      @media (max-width: 640px) {
        .stage {
          width: 100vw;
          height: 100dvh;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage" aria-label="支线漫画横滑预览">
      <section class="comic-track" aria-label="横向滑动切换漫画页">
        <article class="comic-page" aria-label="第 1 页">
          <img src="./assets/page-01.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="第 2 页">
          <img src="./assets/page-02.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="第 3 页">
          <img src="./assets/page-03.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="第 4 页">
          <img src="./assets/page-04.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="第 5 页">
          <img src="./assets/page-05.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="第 6 页">
          <img src="./assets/page-06.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="第 7 页">
          <img src="./assets/page-07.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="原作后续第 1 页" hidden>
          <img src="./assets/original-01.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="原作后续第 2 页" hidden>
          <img src="./assets/original-02.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="原作后续第 3 页" hidden>
          <img src="./assets/original-03.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="原作后续第 4 页" hidden>
          <img src="./assets/original-04.jpg" alt="" draggable="false" />
        </article>
        <article class="comic-page" aria-label="原作后续第 5 页" hidden>
          <img src="./assets/original-05.jpg" alt="" draggable="false" />
        </article>
      </section>
      <div class="slide-progress" aria-hidden="true">
        <div class="progress-track">
          <span class="progress-thumb"></span>
        </div>
      </div>
      <div class="choice-overlay" aria-hidden="true">
        <img src="./assets/page-08-popup.png" alt="" draggable="false" />
        <button
          class="choice-action choice-action--original"
          type="button"
          aria-label="选择原作"
        ></button>
      </div>
    </main>

    <script>
      const stage = document.querySelector(".stage");
      const track = document.querySelector(".comic-track");
      const branchPages = [...document.querySelectorAll(".comic-page[hidden]")];
      const originalChoiceButton = document.querySelector(
        ".choice-action--original",
      );
      let pages = [...document.querySelectorAll(".comic-page:not([hidden])")];
      const progressTrack = document.querySelector(".progress-track");
      const progressThumb = document.querySelector(".progress-thumb");
      const imageMetrics = {
        width: 588,
        height: 1280,
        mobileChromeCropTop: 91,
        progressX: 18,
        progressY: 1079,
        segmentWidth: 33,
        segmentHeight: 4,
        segmentStep: 40,
        visibleSteps: 13,
      };
      const mainPageCount = 7;
      const popupProgressIndex = mainPageCount;
      let startX = 0;
      let startScrollLeft = 0;
      let startPageIndex = 0;
      let dragDeltaX = 0;
      let gestureStartTime = 0;
      let lastPointerX = 0;
      let lastPointerTime = 0;
      let dragVelocityX = 0;
      let isDragging = false;
      let isChoiceOpen = false;
      let isOriginalBranchOpen = false;
      let activePointerId = null;
      let progressFrame = 0;
      let overswipeProgress = 0;

      const getPageWidth = () => track.clientWidth || 1;

      const clamp = (value, min, max) => Math.max(min, Math.min(value, max));

      const refreshPages = () => {
        pages = [...document.querySelectorAll(".comic-page:not([hidden])")];
      };

      const getSourceCropTop = () =>
        window.matchMedia("(max-width: 720px)").matches
          ? imageMetrics.mobileChromeCropTop
          : 0;

      const getMediaLayout = () => {
        const stageRect = stage.getBoundingClientRect();
        const cropTop = getSourceCropTop();
        const scale = Math.max(
          stageRect.width / imageMetrics.width,
          stageRect.height / (imageMetrics.height - cropTop),
        );

        return {
          scale,
          x: (stageRect.width - imageMetrics.width * scale) / 2,
          y: -cropTop * scale,
          width: imageMetrics.width * scale,
          height: imageMetrics.height * scale,
        };
      };

      const updateMediaLayout = () => {
        const media = getMediaLayout();
        stage.style.setProperty("--media-x", `${media.x}px`);
        stage.style.setProperty("--media-y", `${media.y}px`);
        stage.style.setProperty("--media-width", `${media.width}px`);
        stage.style.setProperty("--media-height", `${media.height}px`);
      };

      const scrollToPage = (index) => {
        const clampedIndex = clamp(index, 0, pages.length - 1);
        track.scrollTo({
          left: clampedIndex * getPageWidth(),
          behavior: "smooth",
        });
      };

      const snapToNearestPage = () => {
        const index = Math.round(track.scrollLeft / getPageWidth());
        scrollToPage(index);
      };

      const getMaxRegularScroll = () => (pages.length - 1) * getPageWidth();

      const setChoiceOpen = (isOpen) => {
        isChoiceOpen = isOpen;
        overswipeProgress = isOpen ? 1 : 0;
        if (isOpen) {
          track.scrollLeft = getMaxRegularScroll();
        }
        stage.classList.toggle("is-choice-open", isOpen);
        scheduleProgressUpdate();
      };

      const openOriginalBranch = () => {
        if (!isOriginalBranchOpen) {
          branchPages.forEach((page) => {
            page.hidden = false;
          });
          isOriginalBranchOpen = true;
          stage.classList.add("is-original-branch");
          refreshPages();
        }

        setChoiceOpen(false);
        requestAnimationFrame(() => {
          scrollToPage(mainPageCount);
          scheduleProgressUpdate();
        });
      };

      const updateProgress = () => {
        progressFrame = 0;
        const media = getMediaLayout();

        const regularIndex = Math.min(
          pages.length - 1,
          Math.max(0, track.scrollLeft / getPageWidth()),
        );
        let progressIndex = regularIndex;
        if (isChoiceOpen) {
          progressIndex = popupProgressIndex;
        } else if (regularIndex >= mainPageCount) {
          progressIndex = regularIndex + 1;
        } else if (regularIndex === mainPageCount - 1) {
          progressIndex = regularIndex + overswipeProgress;
        }
        const maxProgressIndex = imageMetrics.visibleSteps - 1;
        progressIndex = Math.min(maxProgressIndex, progressIndex);
        const thumbX =
          media.x +
          (imageMetrics.progressX +
            imageMetrics.segmentStep * progressIndex) *
            media.scale;
        const thumbY = media.y + imageMetrics.progressY * media.scale;

        progressTrack.style.setProperty(
          "--thumb-width",
          `${imageMetrics.segmentWidth * media.scale}px`,
        );
        progressTrack.style.setProperty(
          "--thumb-height",
          `${imageMetrics.segmentHeight * media.scale}px`,
        );
        progressTrack.style.setProperty("--thumb-x", `${thumbX}px`);
        progressTrack.style.setProperty("--thumb-y", `${thumbY}px`);
      };

      const scheduleProgressUpdate = () => {
        if (progressFrame) return;
        progressFrame = window.requestAnimationFrame(updateProgress);
      };

      track.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "mouse" && event.button !== 0) return;
        activePointerId = event.pointerId;
        isDragging = true;
        startX = event.clientX;
        startPageIndex = Math.round(track.scrollLeft / getPageWidth());
        startScrollLeft = startPageIndex * getPageWidth();
        dragDeltaX = 0;
        gestureStartTime = performance.now();
        lastPointerX = event.clientX;
        lastPointerTime = gestureStartTime;
        dragVelocityX = 0;
        overswipeProgress = 0;
        track.classList.add("is-dragging");
        track.setPointerCapture(activePointerId);
      });

      track.addEventListener("pointermove", (event) => {
        if (!isDragging || event.pointerId !== activePointerId) return;
        const deltaX = event.clientX - startX;
        const now = performance.now();
        dragDeltaX = deltaX;
        dragVelocityX =
          (event.clientX - lastPointerX) /
          Math.max(1, now - lastPointerTime);
        lastPointerX = event.clientX;
        lastPointerTime = now;

        if (isChoiceOpen) {
          if (deltaX > 28) {
            setChoiceOpen(false);
          }
          event.preventDefault();
          return;
        }

        const startsAtLastRegularPage =
          startScrollLeft >= getMaxRegularScroll() - 2;
        if (!isOriginalBranchOpen && startsAtLastRegularPage && deltaX < 0) {
          overswipeProgress = Math.min(1, Math.max(0, -deltaX / getPageWidth()));
          track.scrollLeft = getMaxRegularScroll();
          if (-deltaX > 24) {
            setChoiceOpen(true);
          } else {
            scheduleProgressUpdate();
          }
          event.preventDefault();
          return;
        }

        overswipeProgress = 0;
        track.scrollLeft = clamp(
          startScrollLeft - deltaX,
          0,
          getMaxRegularScroll(),
        );
        event.preventDefault();
      });

      const finishDrag = (event) => {
        if (!isDragging || event.pointerId !== activePointerId) return;
        isDragging = false;
        activePointerId = null;
        track.classList.remove("is-dragging");
        if (!isChoiceOpen) {
          const distanceThreshold = getPageWidth() * 0.5;
          const velocityThreshold = 0.55;
          const isFastFlick =
            performance.now() - gestureStartTime < 260 &&
            Math.abs(dragDeltaX) > 48;
          let targetPageIndex = startPageIndex;

          if (
            dragDeltaX < -distanceThreshold ||
            dragVelocityX < -velocityThreshold ||
            (isFastFlick && dragDeltaX < 0)
          ) {
            targetPageIndex = startPageIndex + 1;
          } else if (
            dragDeltaX > distanceThreshold ||
            dragVelocityX > velocityThreshold ||
            (isFastFlick && dragDeltaX > 0)
          ) {
            targetPageIndex = startPageIndex - 1;
          }

          overswipeProgress = 0;
          scrollToPage(targetPageIndex);
          scheduleProgressUpdate();
        }
      };

      track.addEventListener("pointerup", finishDrag);
      track.addEventListener("pointercancel", finishDrag);
      originalChoiceButton.addEventListener("click", openOriginalBranch);

      track.addEventListener(
        "wheel",
        (event) => {
          if (Math.abs(event.deltaX) <= Math.abs(event.deltaY)) return;
          event.preventDefault();
          if (isChoiceOpen) {
            if (event.deltaX < 0) {
              setChoiceOpen(false);
            }
            return;
          }

          if (
            !isOriginalBranchOpen &&
            track.scrollLeft >= getMaxRegularScroll() - 2 &&
            event.deltaX > 0
          ) {
            setChoiceOpen(true);
            return;
          }

          overswipeProgress = 0;
          track.scrollLeft += event.deltaX;
          window.clearTimeout(track.snapTimer);
          track.snapTimer = window.setTimeout(snapToNearestPage, 120);
        },
        { passive: false },
      );

      track.addEventListener("scroll", scheduleProgressUpdate, { passive: true });
      window.addEventListener("resize", () => {
        if (isChoiceOpen) {
          track.scrollLeft = getMaxRegularScroll();
        }
        updateMediaLayout();
        snapToNearestPage();
        scheduleProgressUpdate();
      });
      updateMediaLayout();
      updateProgress();
    </script>
  </body>
</html>
